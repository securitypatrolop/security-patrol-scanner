<!DOCTYPE html>
<!-- v1.11.0 - Unified Security Patrol Scanner -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Security Patrol Scanner</title>
  <!-- v1.9.9.0 - Navigation-Safe Scanner -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --bg: #0f1720;
      --panel: #17212b;
      --text: #f8fafc;
      --muted: #aeb8c4;
      --line: rgba(255,255,255,.12);
      --control: rgba(255,255,255,.12);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
    }

    body {
      font-family: Arial, sans-serif;
      color: var(--text);
    }

    .page {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 680px;
      margin: 0 auto;
      padding:
        calc(8px + var(--safe-top))
        calc(10px + var(--safe-right))
        calc(8px + var(--safe-bottom))
        calc(10px + var(--safe-left));
      overflow: hidden;
    }

    .card {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1.2vh, 10px);
      background: var(--bg);
      text-align: center;
      overflow: hidden;
    }

    .scanner-header {
      flex: 0 0 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 2px 2px 0;
      text-align: left;
    }

    .header-copy {
      min-width: 0;
    }

    .eyebrow {
      font-size: clamp(9px, 1.5vh, 11px);
      font-weight: 800;
      letter-spacing: .9px;
      color: #91a0af;
    }

    h1 {
      margin: 2px 0 0;
      font-size: clamp(13px, 2.4vh, 18px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: .15px;
      white-space: nowrap;
    }

    .expected {
      flex: 0 0 auto;
      min-width: 88px;
      max-width: 48vw;
      padding: clamp(5px, 1vh, 8px) 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
      text-align: right;
      overflow: hidden;
    }

    .expected .point {
      font-size: clamp(15px, 2.8vh, 20px);
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .expected .name {
      margin-top: 3px;
      font-size: clamp(9px, 1.6vh, 11px);
      line-height: 1.15;
      font-weight: 700;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .camera-stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      border-radius: clamp(12px, 2vh, 18px);
      background: #000;
      border: 1px solid rgba(255,255,255,.08);
    }

    #reader {
      width: 100% !important;
      height: 100% !important;
      min-height: 0 !important;
      margin: 0 !important;
      overflow: hidden !important;
      border: 0 !important;
      border-radius: inherit;
      background: #000;
    }

    #reader > div {
      width: 100% !important;
      height: 100% !important;
      min-height: 0 !important;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      max-height: none !important;
      object-fit: cover !important;
      border-radius: inherit;
    }

    #reader canvas {
      max-width: 100% !important;
      max-height: 100% !important;
    }

    .scan-corners {
      position: absolute;
      inset: 50% auto auto 50%;
      width: min(64vw, 260px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
    }

    .scan-corners::before,
    .scan-corners::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
    }

    .scan-corners::before {
      border:
        3px solid rgba(255,255,255,.92);
      clip-path: polygon(
        0 0, 24% 0, 24% 3px, 3px 3px, 3px 24%, 0 24%,
        0 76%, 3px 76%, 3px calc(100% - 3px), 24% calc(100% - 3px), 24% 100%, 0 100%,
        76% 100%, 76% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 76%, 100% 76%,
        100% 24%, calc(100% - 3px) 24%, calc(100% - 3px) 3px, 76% 3px, 76% 0
      );
    }

    .scanner-footer {
      flex: 0 0 auto;
      min-height: 0;
      display: grid;
      gap: clamp(5px, 1vh, 8px);
    }

    .message {
      min-height: 16px;
      margin: 0;
      padding: 0 4px;
      font-size: clamp(11px, 1.9vh, 14px);
      line-height: 1.25;
      font-weight: 700;
      color: #d8e0e8;
    }

    .ok { color: #86efac; }
    .warn { color: #fcd34d; }
    .error { color: #fca5a5; }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 34px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: .42;
      cursor: default;
    }

    .camera-controls {
      display: flex;
      gap: 8px;
      margin: 0;
      justify-content: center;
      align-items: center;
    }

    .camera-control {
      width: auto;
      min-width: 44px;
      min-height: 34px;
      margin: 0;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--control);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      box-shadow: none;
    }

    #retryButton {
      width: auto;
      min-height: 34px;
      margin: 0;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .back-button {
      background: transparent;
      color: #c8d1da;
      border: 1px solid var(--line);
    }

    #retryButton {
      background: #e2e8f0;
      color: #17212b;
    }

    .small {
      margin: 0;
      padding: 0 4px;
      color: #8f9ba7;
      font-size: clamp(8px, 1.4vh, 10px);
      line-height: 1.2;
    }

    .hidden { display: none !important; }

    /* Short phones: preserve camera space first. */
    @media (max-height: 720px) {
      .page {
        padding-top: calc(5px + var(--safe-top));
        padding-bottom: calc(5px + var(--safe-bottom));
      }

      .card {
        gap: 5px;
      }

      .eyebrow {
        display: none;
      }

      h1 {
        margin: 0;
        font-size: 13px;
      }

      .expected {
        padding: 5px 8px;
      }

      .expected .point {
        font-size: 15px;
      }

      .expected .name {
        font-size: 9px;
      }

      .small {
        display: none;
      }

      .message {
        font-size: 11px;
      }

      .camera-control,
      #retryButton {
        min-height: 30px;
        padding-top: 5px;
        padding-bottom: 5px;
      }
    }

    /* Very short phones: keep only the essentials. */
    @media (max-height: 610px) {
      .expected .name {
        display: none;
      }

      .message {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .scan-corners {
        width: min(52vh, 220px);
      }
    }

    /* Landscape phones/tablets. */
    @media (orientation: landscape) and (max-height: 600px) {
      .page {
        max-width: none;
        padding-left: calc(8px + var(--safe-left));
        padding-right: calc(8px + var(--safe-right));
      }

      .scanner-header {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .expected {
        max-width: 38vw;
      }

      .scan-corners {
        width: min(52vh, 230px);
      }
    }

<body>
<div class="page">
  <div class="card">
    <div class="scanner-brandbar">
      <div class="scanner-brand">
        <div class="scanner-brand-shield" aria-hidden="true"><span>✓</span></div>
        <div class="scanner-brand-name">SECURITY PATROL</div>
      </div>
    </div>

    <div class="scanner-context">
      <div class="scanner-context-label">SCAN CHECKPOINT</div>
      <div class="expected">
        <div id="expectedPoint" class="point">CHECKPOINT</div>
        <div id="expectedName" class="name"></div>
      </div>
    </div>

    <div class="camera-stage">
      <div id="reader"></div>
      <div class="scan-corners" aria-hidden="true"></div>
    </div>

    <div class="scanner-footer">
      <div id="message" class="message">Starting camera...</div>

      <div class="controls-row">
        <div id="cameraControls" class="camera-controls hidden">
          <button id="switchCameraButton"
                  class="camera-control"
                  type="button"
                  title="Switch rear camera"
                  aria-label="Switch rear camera"
                  onclick="switchRearCamera_()">
            📷
          </button>

          <button id="zoomButton"
                  class="camera-control"
                  type="button"
                  title="Change camera zoom"
                  aria-label="Change camera zoom"
                  onclick="toggleZoom_()">
            1×
          </button>
        </div>

        <button id="retryButton"
                class="hidden"
                onclick="startScanner()">
          TRY AGAIN
        </button>

      </div>

      <div class="small">
        Scan the physical checkpoint QR. GPS verification happens on the patrol page.
      </div>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  const expected = Number(params.get('expected'));
  const totalCheckpoints = Number(params.get('total')) || 22;
  const expectedName = params.get('name') || '';
  const returnUrl = params.get('return') || '';
  const voiceEnabled = params.get('voice') !== '0';

  let scanner = null;
  let scannerRunning = false;
  let detectionLocked = false;

  let scannerVoiceUnlockedV1107 =
    false;

  const CAMERA_STORAGE_KEY = 'securityPatrolPreferredCameraId';
  const ZOOM_STORAGE_KEY = 'securityPatrolPreferredZoom';

  let availableRearCameras = [];
  let activeRearCameraIndex = -1;
  let activeCameraId = '';
  let currentZoom = 1;
  let zoomCapability = null;

  document.getElementById('expectedPoint').textContent =
    Number.isInteger(expected)
      ? (String(expected).padStart(2, '0') + ' / ' + String(totalCheckpoints).padStart(2, '0'))
      : 'CHECKPOINT';

  document.getElementById('expectedName').textContent = expectedName || '';

  window.addEventListener(
    'load',
    handleScannerLoadV1107_
  );

  document.addEventListener(
    'pointerdown',
    unlockScannerVoiceV1107_,
    true
  );

  document.addEventListener(
    'keydown',
    unlockScannerVoiceV1107_,
    true
  );

  window.addEventListener('pagehide', function() {
    stopScanner();
  });


  function handleScannerLoadV1107_() {
    try {
      if (
        navigator.userActivation &&
        navigator.userActivation.hasBeenActive
      ) {
        scannerVoiceUnlockedV1107 =
          true;
      }
    } catch (ignored) {}

    speakScanner(
      Number.isInteger(expected)
        ? (
            'Scanner opened. Scan checkpoint ' +
            expected +
            '.'
          )
        : 'Scanner opened.'
    );

    startScanner();
  }


  function unlockScannerVoiceV1107_() {
    if (
      scannerVoiceUnlockedV1107 ||
      !scannerVoiceSupported()
    ) {
      return;
    }

    scannerVoiceUnlockedV1107 =
      true;

    speakScanner(
      Number.isInteger(expected)
        ? (
            'Ready to scan checkpoint ' +
            expected +
            '.'
          )
        : 'Ready to scan.'
    );
  }


  function speakScannerAndWaitV1107_(
    text,
    maximumWaitMs
  ) {
    return new Promise(
      function(resolve) {
        if (
          !scannerVoiceSupported() ||
          !text
        ) {
          resolve();
          return;
        }

        let finished = false;

        function done() {
          if (finished) return;
          finished = true;
          resolve();
        }

        try {
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();

          const utterance =
            new SpeechSynthesisUtterance(
              String(text)
            );

          utterance.lang = 'en-MY';
          utterance.rate = 0.75;
          utterance.pitch = 1;
          utterance.volume = 1;

          utterance.onstart =
            function() {
              scannerVoiceUnlockedV1107 =
                true;
            };

          utterance.onend = done;
          utterance.onerror = done;

          window.speechSynthesis.speak(
            utterance
          );

          setTimeout(
            done,
            Number(
              maximumWaitMs || 1200
            )
          );

        } catch (ignored) {
          done();
        }
      }
    );
  }


  function scannerVoiceSupported() {
    return (
      voiceEnabled &&
      'speechSynthesis' in window &&
      'SpeechSynthesisUtterance' in window
    );
  }


  function speakScanner(text) {
    if (!scannerVoiceSupported() || !text) {
      return;
    }

    try {
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();

      const utterance =
        new SpeechSynthesisUtterance(String(text));

      utterance.lang = 'en-MY';
      utterance.rate = 0.75;
      utterance.pitch = 1;
      utterance.volume = 1;

      const voices =
        window.speechSynthesis.getVoices();

      const preferredVoice =
        voices.find(function(voice) {
          return String(voice.lang || '').toLowerCase() === 'en-my';
        }) ||
        voices.find(function(voice) {
          return String(voice.lang || '').toLowerCase().indexOf('en-gb') === 0;
        }) ||
        voices.find(function(voice) {
          return String(voice.lang || '').toLowerCase().indexOf('en') === 0;
        });

      if (preferredVoice) {
        utterance.voice = preferredVoice;
      }

      window.speechSynthesis.speak(utterance);

    } catch (ignored) {
      // Scanner voice must never interfere with QR scanning.
    }
  }


  async function loadRearCameras_() {
    let cameras = [];

    try {
      cameras = await Html5Qrcode.getCameras();
    } catch (ignored) {
      cameras = [];
    }

    const ranked = cameras
      .map(function(camera, index) {
        const label = String(camera.label || '').toLowerCase();
        let score = 0;

        if (/back|rear|environment/.test(label)) score += 100;
        if (/main|primary|standard/.test(label)) score += 60;
        if (/\bwide\b/.test(label) && !/ultra/.test(label)) score += 15;

        if (/ultra[\s-]?wide|ultrawide|0[\.,]5x?|macro|telephoto|depth/.test(label)) {
          score -= 180;
        }

        if (/front|selfie|user/.test(label)) {
          score -= 250;
        }

        score -= index;

        return {
          camera: camera,
          label: label,
          score: score,
          originalIndex: index
        };
      });

    const rearCandidates = ranked.filter(function(item) {
      return !/front|selfie|user/.test(item.label);
    });

    rearCandidates.sort(function(a, b) {
      return b.score - a.score;
    });

    availableRearCameras = rearCandidates.map(function(item) {
      return item.camera;
    });

    if (!availableRearCameras.length) {
      availableRearCameras = cameras.slice();
    }

    return availableRearCameras;
  }


  function loadRememberedCameraId_() {
    try {
      return String(localStorage.getItem(CAMERA_STORAGE_KEY) || '');
    } catch (ignored) {
      return '';
    }
  }


  function rememberCameraId_(cameraId) {
    try {
      if (cameraId) {
        localStorage.setItem(CAMERA_STORAGE_KEY, cameraId);
      }
    } catch (ignored) {}
  }


  function loadRememberedZoom_() {
    try {
      const saved = Number(localStorage.getItem(ZOOM_STORAGE_KEY));
      return Number.isFinite(saved) && saved > 0 ? saved : 1;
    } catch (ignored) {
      return 1;
    }
  }


  function rememberZoom_(zoom) {
    try {
      localStorage.setItem(ZOOM_STORAGE_KEY, String(zoom));
    } catch (ignored) {}
  }


  async function getPreferredRearCamera_() {
    await loadRearCameras_();

    if (!availableRearCameras.length) {
      activeRearCameraIndex = -1;
      activeCameraId = '';
      return { facingMode: { exact: 'environment' } };
    }

    const rememberedId = loadRememberedCameraId_();
    let selectedIndex = -1;

    if (rememberedId) {
      selectedIndex = availableRearCameras.findIndex(function(camera) {
        return String(camera.id) === rememberedId;
      });
    }

    if (selectedIndex < 0) {
      selectedIndex = 0;
    }

    activeRearCameraIndex = selectedIndex;
    activeCameraId = String(availableRearCameras[selectedIndex].id || '');

    if (activeCameraId) {
      return { deviceId: { exact: activeCameraId } };
    }

    return { facingMode: { exact: 'environment' } };
  }


  async function readCameraZoomCapability_() {
    zoomCapability = null;

    if (!scanner || !scannerRunning) {
      return;
    }

    try {
      const capabilities = scanner.getRunningTrackCapabilities();
      if (
        capabilities &&
        capabilities.zoom &&
        typeof capabilities.zoom.min === 'number' &&
        typeof capabilities.zoom.max === 'number'
      ) {
        zoomCapability = capabilities.zoom;
      }
    } catch (ignored) {}
  }


  async function applyPreferredZoom_() {
    await readCameraZoomCapability_();

    if (!zoomCapability) {
      currentZoom = 1;
      updateCameraControls_();
      return;
    }

    let desired = loadRememberedZoom_();

    desired = Math.min(
      zoomCapability.max,
      Math.max(zoomCapability.min, desired)
    );

    currentZoom = desired;

    try {
      await scanner.applyVideoConstraints({
        advanced: [{ zoom: desired }]
      });
    } catch (ignored) {}

    updateCameraControls_();
  }


  async function toggleZoom_() {
    if (!zoomCapability || !scannerRunning) {
      return;
    }

    const canUseTwo =
      zoomCapability.max >= 2 &&
      zoomCapability.min <= 2;

    let nextZoom;

    if (canUseTwo) {
      nextZoom = currentZoom >= 1.75 ? 1 : 2;
    } else {
      const midpoint =
        Math.max(
          zoomCapability.min,
          Math.min(
            zoomCapability.max,
            (zoomCapability.min + zoomCapability.max) / 2
          )
        );

      nextZoom =
        Math.abs(currentZoom - zoomCapability.min) < 0.05
          ? midpoint
          : zoomCapability.min;
    }

    nextZoom = Math.min(
      zoomCapability.max,
      Math.max(zoomCapability.min, nextZoom)
    );

    try {
      await scanner.applyVideoConstraints({
        advanced: [{ zoom: nextZoom }]
      });

      currentZoom = nextZoom;
      rememberZoom_(nextZoom);
      updateCameraControls_();

    } catch (ignored) {}
  }


  async function switchRearCamera_() {
    if (availableRearCameras.length <= 1) {
      return;
    }

    const nextIndex =
      activeRearCameraIndex < 0
        ? 0
        : (activeRearCameraIndex + 1) % availableRearCameras.length;

    const nextCamera =
      availableRearCameras[nextIndex];

    const nextCameraId =
      String(nextCamera && nextCamera.id || '');

    if (!nextCameraId) {
      return;
    }

    setMessage('Switching rear camera...', '');

    await stopScanner();

    activeRearCameraIndex = nextIndex;
    activeCameraId = nextCameraId;
    rememberCameraId_(nextCameraId);

    await startScannerWithCamera_({
      deviceId: { exact: nextCameraId }
    });
  }


  function updateCameraControls_() {
    const controls =
      document.getElementById('cameraControls');

    const switchButton =
      document.getElementById('switchCameraButton');

    const zoomButton =
      document.getElementById('zoomButton');

    if (!controls || !switchButton || !zoomButton) {
      return;
    }

    const multipleRearCameras =
      availableRearCameras.length > 1;

    const zoomAvailable =
      !!zoomCapability &&
      zoomCapability.max > zoomCapability.min;

    if (!multipleRearCameras && !zoomAvailable) {
      controls.classList.add('hidden');
      return;
    }

    controls.classList.remove('hidden');

    switchButton.disabled = !multipleRearCameras;
    switchButton.classList.toggle('hidden', !multipleRearCameras);

    zoomButton.disabled = !zoomAvailable;
    zoomButton.classList.toggle('hidden', !zoomAvailable);

    if (zoomAvailable) {
      const rounded =
        Math.round(currentZoom * 10) / 10;

      zoomButton.textContent =
        String(rounded).replace(/\.0$/, '') + '×';

      zoomButton.title =
        'Camera zoom ' + zoomButton.textContent;
    }
  }


  function getAdaptiveQrBox_() {
    const reader = document.getElementById('reader');

    if (!reader) {
      return { width: 220, height: 220 };
    }

    const rect = reader.getBoundingClientRect();
    const available =
      Math.max(
        120,
        Math.min(
          Number(rect.width) || 320,
          Number(rect.height) || 320
        )
      );

    const side =
      Math.floor(
        Math.max(
          120,
          Math.min(260, available * 0.68)
        )
      );

    return {
      width: side,
      height: side
    };
  }


  async function startScannerWithCamera_(cameraConfig) {
    scanner = new Html5Qrcode('reader');
    scannerRunning = true;

    await scanner.start(
      cameraConfig,
      {
        fps: 10,
        qrbox: getAdaptiveQrBox_()
      },
      onQrDetected,
      function() {}
    );

    try {
      const settings = scanner.getRunningTrackSettings();
      if (settings && settings.deviceId) {
        activeCameraId = String(settings.deviceId);

        const matchedIndex =
          availableRearCameras.findIndex(function(camera) {
            return String(camera.id) === activeCameraId;
          });

        if (matchedIndex >= 0) {
          activeRearCameraIndex = matchedIndex;
        }

        rememberCameraId_(activeCameraId);
      }
    } catch (ignored) {}

    await applyPreferredZoom_();

    setMessage(
      'Ready to scan checkpoint QR.',
      ''
    );

    // Voice is handled at scanner entry or natural scanner interaction.
  }




  async function startScanner() {
    detectionLocked = false;

    if (!window.isSecureContext) {
      showError(
        'Camera requires HTTPS. This scanner page must be hosted on a secure HTTPS address.'
      );
      return;
    }

    if (!navigator.onLine) {
      showError(
        'No internet connection. Reconnect before scanning the next checkpoint.'
      );
      return;
    }

    if (typeof Html5Qrcode === 'undefined') {
      showError(
        'QR scanner library could not load. Refresh the page and try again.'
      );
      return;
    }

    document.getElementById('retryButton').classList.add('hidden');
    setMessage('Opening camera...', '');

    try {
      const cameraConfig = await getPreferredRearCamera_();
      await startScannerWithCamera_(cameraConfig);

    } catch (error) {
      scannerRunning = false;
      scanner = null;

      showError(
        'Camera access was not granted or the camera could not start. Allow camera permission in the browser and try again.'
      );
    }
  }


  async function onQrDetected(decodedText) {
    if (detectionLocked) return;

    const scannedPoint = extractPoint(decodedText);

    if (!Number.isInteger(scannedPoint)) {
      setMessage(
        'Invalid patrol QR. Scan the checkpoint QR.',
        'warn'
      );
      return;
    }

    if (!returnUrl) {
      showError('Patrol return address is missing.');
      return;
    }

    detectionLocked = true;

    setMessage('Checkpoint scanned. Returning...', 'ok');

    await speakScannerAndWaitV1107_(
      'Checkpoint scanned.',
      1200
    );

    await stopScanner();

    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage(
          {
            type: 'PATROL_QR_SCANNED',
            point: scannedPoint
          },
          '*'
        );

        try {
          window.opener.focus();
        } catch (ignored) {}

        setTimeout(function() {
          try {
            window.close();
          } catch (ignored) {}
        }, 150);

        return;

      } catch (ignored) {}
    }

    // Fallback if opener communication is unavailable.
    // replace() avoids adding another stale Guard page to browser history.
    window.location.replace(
      returnUrl +
      '?point=' +
      encodeURIComponent(scannedPoint) +
      '&scannerReturn=1'
    );
  }


  function extractPoint(text) {
    try {
      const parsed = new URL(text);
      const point = Number(parsed.searchParams.get('point'));

      if (Number.isInteger(point) && point >= 1 && point <= 999) {
        return point;
      }
    } catch (ignored) {}

    const plain = String(text || '').trim();

    if (/^\d{1,3}$/.test(plain)) {
      return Number(plain);
    }

    const match = plain.match(/(?:point|cp)\s*[-:#]?\s*(\d{1,3})/i);

    if (match) {
      return Number(match[1]);
    }

    return null;
  }


  async function stopScanner() {
    if (scanner && scannerRunning) {
      try {
        await scanner.stop();
      } catch (ignored) {}
    }

    if (scanner) {
      try {
        scanner.clear();
      } catch (ignored) {}
    }

    scannerRunning = false;
    scanner = null;
    zoomCapability = null;
    updateCameraControls_();
  }


  function setMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text || '';
    el.className = 'message' + (type ? ' ' + type : '');
  }


  function showError(text) {
    setMessage(text, 'error');
    document.getElementById('retryButton').classList.remove('hidden');
  }
</script>
</body>
</html>
