<!DOCTYPE html>
<!-- 2.0.0.0alpha10.1 - Camera Capability Diagnostic -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Security Patrol Scanner</title>
  <!-- v1.9.9.0 - Navigation-Safe Scanner -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    /* =========================================================
       SECURITY PATROL 2.0.0-alpha3
       Immersive Scanner
       ========================================================= */

    * { box-sizing: border-box; }

    :root {
      --navy:#08233b;
      --navy-2:#0a2b49;
      --blue:#0b84e5;
      --green:#16834d;
      --red:#cc2d38;
      --amber:#b86b06;
      --text:#102038;
      --muted:#6b8297;
      --line:#d6e4ee;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
    }

    html,
    body {
      width:100%;
      height:100%;
      min-height:0;
      margin:0;
      overflow:hidden;
      overscroll-behavior:none;
      background:#061522;
    }

    body {
      color:#fff;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      touch-action:manipulation;
    }

    button { font:inherit; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    button:disabled { opacity:.5; cursor:default; }
    .hidden { display:none !important; }

    .page {
      width:100%;
      height:100vh;
      height:100dvh;
      min-height:0;
      padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      overflow:hidden;
      background:#061522;
    }

    .card {
      position:relative;
      width:100%;
      height:100%;
      min-height:0;
      max-width:620px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:#061522;
    }

    .scanner-brandbar {
      position:relative;
      z-index:20;
      flex:0 0 auto;
      min-height:60px;
      padding:0 14px;
      display:flex;
      align-items:center;
      background:linear-gradient(90deg,var(--navy),var(--navy-2));
      border-bottom:1px solid rgba(190,220,240,.12);
    }

    .scanner-brand { display:flex; align-items:center; gap:9px; }
    .scanner-brand-shield {
      width:29px;
      height:35px;
      display:grid;
      place-items:center;
      clip-path:polygon(50% 0,91% 16%,91% 54%,74% 79%,50% 100%,26% 79%,9% 54%,9% 16%);
      background:linear-gradient(180deg,#56c5ff,#1287d2);
      color:#fff;
      font-size:16px;
      font-weight:950;
    }
    .scanner-brand-name { color:#fff; font-size:15px; font-weight:900; }

    .scanner-context {
      position:relative;
      z-index:20;
      flex:0 0 auto;
      padding:10px 12px 9px;
      text-align:center;
      background:rgba(8,35,59,.98);
      border-bottom:1px solid rgba(183,215,237,.12);
    }

    .scanner-context-label {
      color:#a9cde4;
      font-size:clamp(11px,3vw,13px);
      line-height:1;
      font-weight:950;
      letter-spacing:1.15px;
    }

    .expected { margin:0; padding:0; background:transparent; border:0; text-align:center; }
    .expected .point {
      margin-top:5px;
      color:#fff;
      line-height:.95;
      font-weight:950;
      letter-spacing:-1.5px;
    }
    .expected .point-current {
      font-size:clamp(43px,11.7vw,58px);
      letter-spacing:-2px;
    }
    .expected .point-total {
      margin-left:4px;
      color:#bdd5e6;
      font-size:clamp(25px,6.7vw,33px);
      font-weight:850;
      letter-spacing:-.6px;
      vertical-align:.16em;
    }
    .expected .name {
      margin-top:6px;
      color:#f0f8fd;
      font-size:clamp(16px,4.4vw,20px);
      line-height:1.12;
      font-weight:900;
    }

    .camera-stage {
      position:relative;
      flex:1 1 0;
      min-height:0;
      margin:0;
      overflow:hidden;
      border:0;
      border-radius:0;
      background:#000;
      box-shadow:none;
    }

    #reader {
      position:absolute !important;
      inset:0 !important;
      width:100% !important;
      height:100% !important;
      min-height:100% !important;
      display:flex !important;
      align-items:center;
      justify-content:center;
      overflow:hidden !important;
      background:#000;
    }

    #reader > div { width:100% !important; height:100% !important; margin:0 !important; }
    #reader video {
      width:100% !important;
      height:100% !important;
      max-width:none !important;
      object-fit:cover !important;
      object-position:50% 50% !important;
    }

    #reader img,
    #reader button,
    #reader select { max-width:100%; }

    .scan-corners {
      --scan-accent:#25a9ff;
      --scan-accent-soft:rgba(37,169,255,.42);
      --scan-glow:rgba(37,169,255,.44);
      position:absolute;
      z-index:8;
      left:50%;
      top:50%;
      width:min(64vw,260px);
      aspect-ratio:1/1;
      transform:translate(-50%,-50%);
      pointer-events:none;
      background:
        linear-gradient(var(--scan-accent-soft),var(--scan-accent-soft)) center top/24px 1px no-repeat,
        linear-gradient(var(--scan-accent-soft),var(--scan-accent-soft)) center bottom/24px 1px no-repeat,
        linear-gradient(var(--scan-accent-soft),var(--scan-accent-soft)) left center/1px 24px no-repeat,
        linear-gradient(var(--scan-accent-soft),var(--scan-accent-soft)) right center/1px 24px no-repeat;
      filter:drop-shadow(0 0 7px var(--scan-glow));
      transition:filter .12s ease,opacity .12s ease;
    }

    .scan-corners::before,
    .scan-corners::after {
      content:"";
      position:absolute;
      pointer-events:none;
    }

    .scan-corners::before {
      inset:0;
      background:
        linear-gradient(var(--scan-accent),var(--scan-accent)) left top/52px 4px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) left top/4px 52px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) right top/52px 4px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) right top/4px 52px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) left bottom/52px 4px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) left bottom/4px 52px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) right bottom/52px 4px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) right bottom/4px 52px no-repeat;
      animation:scanTechPulseV200a7_ 1.8s ease-in-out infinite;
    }

    .scan-corners::after {
      inset:10px;
      opacity:.58;
      background:
        linear-gradient(var(--scan-accent),var(--scan-accent)) left top/22px 2px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) left top/2px 22px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) right top/22px 2px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) right top/2px 22px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) left bottom/22px 2px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) left bottom/2px 22px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) right bottom/22px 2px no-repeat,
        linear-gradient(var(--scan-accent),var(--scan-accent)) right bottom/2px 22px no-repeat;
    }

    .scan-corners.is-detected {
      --scan-accent:#35d98a;
      --scan-accent-soft:rgba(53,217,138,.52);
      --scan-glow:rgba(53,217,138,.64);
      filter:drop-shadow(0 0 11px var(--scan-glow));
    }

    .scan-corners.is-confirmed::before {
      animation:scanConfirmV200a7_ .28s ease-out 1;
    }

    @keyframes scanTechPulseV200a7_ {
      0%,100% { opacity:.78; }
      50% { opacity:1; }
    }

    @keyframes scanConfirmV200a7_ {
      0% { opacity:.7; }
      45% { opacity:1; }
      100% { opacity:.9; }
    }

    @media (prefers-reduced-motion:reduce) {
      .scan-corners::before,
      .scan-corners.is-confirmed::before { animation:none !important; }
    }

    .scanner-footer {
      position:absolute;
      z-index:18;
      left:0;
      right:0;
      bottom:0;
      min-height:116px;
      padding:34px 12px calc(10px + var(--safe-bottom));
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      gap:7px;
      background:linear-gradient(180deg,rgba(2,13,22,0),rgba(2,13,22,.76) 30%,rgba(2,13,22,.95));
      pointer-events:none;
    }

    .message {
      min-height:17px;
      max-width:92%;
      color:#eef8ff;
      font-size:clamp(10px,2.8vw,12px);
      line-height:1.2;
      font-weight:800;
      text-align:center;
      text-shadow:0 1px 3px rgba(0,0,0,.5);
      pointer-events:auto;
    }
    .message.ok { color:#b9f4d4; }
    .message.warn { color:#ffe0a9; }
    .message.error { color:#ffc3c7; }

    .controls-row { width:100%; display:flex; justify-content:center; align-items:center; pointer-events:auto; }
    .camera-controls { display:flex; align-items:center; justify-content:center; gap:10px; }

    .camera-control {
      min-width:58px;
      min-height:50px;
      padding:7px 10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(205,229,244,.26);
      border-radius:15px;
      background:rgba(5,31,50,.76);
      backdrop-filter:blur(8px);
      color:#fff;
      font-size:15px;
      font-weight:900;
      box-shadow:0 5px 18px rgba(0,0,0,.18);
      transition:transform .10s ease, background .12s ease, border-color .12s ease;
    }
    .camera-control:active { transform:translateY(1px) scale(.97); }
    #torchButton { position:relative; }
    #torchButton.is-on {
      background:rgba(11,132,229,.92);
      border-color:#5bb6f4;
      text-shadow:0 0 9px rgba(255,231,120,.95);
      box-shadow:0 0 16px rgba(91,182,244,.38),0 5px 18px rgba(0,0,0,.18);
    }
    #torchButton.is-unavailable:disabled { opacity:.72; }
    #torchButton.is-unavailable::before,
    #torchButton.is-unavailable::after {
      content:"";
      position:absolute;
      width:25px;
      height:2px;
      border-radius:2px;
      left:50%;
      top:50%;
      margin-left:-12.5px;
      margin-top:-1px;
      background:#ff4d57;
      pointer-events:none;
    }
    #torchButton.is-unavailable::before { transform:rotate(45deg); }
    #torchButton.is-unavailable::after { transform:rotate(-45deg); }

    #cameraDiagnosticButton {
      font-size:13px;
      letter-spacing:.3px;
    }

    .camera-diagnostic-overlay {
      position:fixed;
      z-index:9998;
      inset:0;
      padding:calc(16px + var(--safe-top)) calc(14px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(14px + var(--safe-left));
      display:flex;
      align-items:flex-end;
      justify-content:center;
      background:rgba(2,13,22,.72);
      backdrop-filter:blur(4px);
    }

    .camera-diagnostic-card {
      width:min(100%,560px);
      max-height:78dvh;
      padding:14px;
      border:1px solid rgba(190,220,240,.26);
      border-radius:16px;
      overflow:auto;
      background:#08233b;
      box-shadow:0 16px 40px rgba(0,0,0,.38);
    }

    .camera-diagnostic-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    .camera-diagnostic-title {
      font-size:13px;
      font-weight:950;
      letter-spacing:.6px;
    }

    .camera-diagnostic-close {
      min-width:64px;
      min-height:34px;
      padding:6px 10px;
      border-radius:10px;
      background:rgba(205,229,244,.14);
      color:#fff;
      font-size:11px;
      font-weight:900;
    }

    .camera-diagnostic-output {
      margin:0;
      color:#d9edf9;
      font:700 11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    #retryButton {
      min-height:48px;
      padding:10px 18px;
      border-radius:13px;
      background:linear-gradient(180deg,#1498ef,#0878ce);
      color:#fff;
      font-size:13px;
      font-weight:950;
      box-shadow:0 7px 18px rgba(8,120,206,.28);
    }

    .small {
      color:#c2d7e5;
      font-size:9px;
      line-height:1.15;
      text-align:center;
      opacity:.9;
      pointer-events:none;
    }

    .scanner-back-toast-v1113 {
      position:fixed;
      z-index:9999;
      left:50%;
      bottom:max(18px,var(--safe-bottom));
      width:min(calc(100% - 28px),420px);
      transform:translate(-50%,16px);
      padding:12px 14px;
      border-radius:13px;
      background:var(--navy);
      color:#fff;
      box-shadow:0 12px 30px rgba(0,0,0,.26);
      opacity:0;
      visibility:hidden;
      transition:opacity .18s ease,transform .18s ease,visibility .18s ease;
      pointer-events:none;
      text-align:center;
      font-size:12px;
      font-weight:850;
    }
    .scanner-back-toast-v1113.show { opacity:1; visibility:visible; transform:translate(-50%,0); }

    @media (max-height:700px) {
      .scanner-brandbar { min-height:50px; padding:0 10px; }
      .scanner-brand-shield { width:25px; height:30px; font-size:14px; }
      .scanner-brand-name { font-size:13px; }
      .scanner-context { padding:6px 9px 5px; }
      .scanner-context-label { font-size:9px; }
      .expected .point-current { font-size:clamp(32px,8.6vw,40px); }
      .expected .point-total { font-size:clamp(19px,5vw,24px); }
      .expected .name { margin-top:3px; font-size:clamp(13px,3.5vw,15px); }
      .scan-corners { width:min(56vw,215px); }
      .scanner-footer { min-height:96px; padding-top:26px; gap:4px; }
      .camera-control { min-width:52px; min-height:44px; border-radius:12px; font-size:13px; }
      .small { font-size:7.5px; }
    }

    @media (max-height:600px) {
      .small { display:none; }
      .scanner-brandbar { min-height:44px; }
      .scanner-context { padding:4px 7px; }
      .expected .point-current { font-size:29px; }
      .expected .point-total { font-size:18px; }
      .scan-corners { width:min(49vw,190px); }
      .scanner-footer { min-height:78px; padding-top:18px; }
      .camera-control { min-width:48px; min-height:40px; }
    }

  
    /* =========================================================
       v2.0.0-alpha3 - OPTICAL CENTERING & SHARED TIME CONTEXT
       ========================================================= */

    .scanner-brandbar {
      justify-content: space-between;
      gap: 10px;
    }

    .scanner-clock {
      max-width: 112px;
      color: #b9d1e2;
      font-size: clamp(7.5px, 2vw, 9px);
      line-height: 1.18;
      font-weight: 780;
      text-align: right;
    }

    .scanner-context-label {
      font-size: clamp(13px, 3.5vw, 15px);
    }

    /*
      The html5-qrcode scan region is centered inside #reader.
      Alpha2 placed the custom blue frame at 48%, which made the two
      viewfinders visibly disagree. Alpha3 uses the same 50/50 center.
    */
    .scan-corners {
      top: 50% !important;
      left: 50% !important;
      width: var(--scan-box-size-v200a3, min(64vw,260px)) !important;
      max-width: 72vw;
      transform: translate(-50%, -50%) !important;
    }

    @media (max-height:700px) {
      .scanner-clock {
        max-width: 95px;
        font-size: 7px;
      }

      .scanner-context-label {
        font-size: 10px;
      }
    }

    @media (max-width:380px) {
      .scanner-clock {
        max-width: 82px;
        font-size: 6.5px;
      }
    }

    /* =========================================================
       2.0.0.0alpha5 - FIELD CONSISTENCY SCANNER
       - shared Security Patrol header matches Guard (no shield badge)
       - header clock remains readable without crowding
       - scan target moves upward while keeping the real html5-qrcode
         scan region and custom corner guide optically synchronized
       ========================================================= */

    .scanner-brand-name {
      font-size: 16px;
    }

    .scanner-clock {
      max-width: 132px;
      font-size: clamp(9px, 2.45vw, 11px);
      line-height: 1.15;
      font-weight: 800;
    }

    /*
      html5-qrcode centers its qrbox inside #reader and does not expose a
      vertical qrbox offset. To move the REAL scan region upward safely,
      enlarge #reader below the clipped camera stage and shift its top upward.
      A 120% reader beginning at -20% places its internal 50% center at 40%
      of the visible stage. The custom guide uses that same 40% center.
    */
    #reader {
      top: -20% !important;
      bottom: 0 !important;
      height: 120% !important;
      min-height: 120% !important;
    }

    .scan-corners {
      top: 40% !important;
      left: 50% !important;
      width: var(--scan-box-size-v200a3, min(64vw,260px)) !important;
      max-width: 72vw;
      transform: translate(-50%, -50%) !important;
    }

    @media (max-height:700px) {
      .scanner-clock {
        max-width: 112px;
        font-size: clamp(8px, 2.2vw, 9.5px);
      }
    }

    @media (max-width:380px) {
      .scanner-clock {
        max-width: 102px;
        font-size: clamp(7.5px, 2.1vw, 9px);
      }
    }

    /* =========================================================
       2.0.0.0alpha8 - CAMERA, HAPTIC & DETECTION REFINEMENT
       - high-tech dual-layer scan reticle
       - green first-detection feedback
       - frame remains optically synchronized with real qrbox
       ========================================================= */

    .scan-corners.is-detected::after {
      opacity:.82;
    }


  </style>
</head>

<body>
<div class="page">
  <div class="card">
    <div class="scanner-brandbar">
      <div class="scanner-brand">
        <div class="scanner-brand-name">SECURITY PATROL</div>
      </div>
      <div id="scannerClockV200a3" class="scanner-clock"></div>
    </div>

    <div class="scanner-context">
      <div class="scanner-context-label">SCAN CHECKPOINT</div>
      <div class="expected">
        <div id="expectedPoint" class="point">CHECKPOINT</div>
        <div id="expectedName" class="name"></div>
      </div>
    </div>

    <div class="camera-stage">
      <div id="reader"></div>
      <div class="scan-corners" aria-hidden="true"></div>
    </div>

    <div class="scanner-footer">
      <div id="message" class="message">Starting camera...</div>

      <div class="controls-row">
        <div id="cameraControls" class="camera-controls hidden">
          <button id="switchCameraButton"
                  class="camera-control"
                  type="button"
                  title="Switch rear camera"
                  aria-label="Switch rear camera"
                  onclick="switchRearCamera_()">
            📷
          </button>

          <button id="torchButton"
                  class="camera-control"
                  type="button"
                  title="Turn flashlight on"
                  aria-label="Turn flashlight on"
                  onclick="toggleTorch_()">
            💡
          </button>

          <button id="zoomButton"
                  class="camera-control"
                  type="button"
                  title="Change camera zoom"
                  aria-label="Change camera zoom"
                  onclick="toggleZoom_()">
            1×
          </button>

          <button id="cameraDiagnosticButton"
                  class="camera-control"
                  type="button"
                  title="Camera diagnostics"
                  aria-label="Camera diagnostics"
                  onclick="openCameraDiagnosticV200A101_()">
            INFO
          </button>
        </div>

        <button id="retryButton"
                class="hidden"
                onclick="startScanner()">
          TRY AGAIN
        </button>

      </div>

      <div class="small">
        Keep the checkpoint QR inside the scan frame. · v2.0.0-alpha10.1
      </div>
    </div>
  </div>
</div>

<div
  id="scannerBackToastV1113"
  class="scanner-back-toast-v1113"
  role="status"
  aria-live="polite"
>
  Back is disabled while the checkpoint scanner is active.
</div>

<div
  id="cameraDiagnosticOverlayV200A101"
  class="camera-diagnostic-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="cameraDiagnosticTitleV200A101"
>
  <div class="camera-diagnostic-card">
    <div class="camera-diagnostic-head">
      <div id="cameraDiagnosticTitleV200A101" class="camera-diagnostic-title">CAMERA CAPABILITY DIAGNOSTIC</div>
      <button
        class="camera-diagnostic-close"
        type="button"
        onclick="closeCameraDiagnosticV200A101_()"
      >
        CLOSE
      </button>
    </div>
    <pre id="cameraDiagnosticOutputV200A101" class="camera-diagnostic-output">Collecting camera information...</pre>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  const expected = Number(params.get('expected'));
  const totalCheckpoints = Number(params.get('total')) || 22;
  const expectedName = params.get('name') || '';
  const returnUrl = params.get('return') || '';
  const voiceEnabled = params.get('voice') !== '0';

  let scanner = null;
  let scannerRunning = false;
  let detectionLocked = false;

  let scannerVoiceUnlockedV1107 =
    false;

  // Alpha10 camera policy:
  // - let the browser/OS choose its default rear camera via facingMode
  // - do not rank camera labels or force an enumerated lens at startup
  // - do not apply any zoom constraint until the guard requests zoom
  // - keep manual camera/zoom changes temporary for the current scan
  // - torch capability never decides which camera is selected

  const QR_CONFIRM_MS_V200A7 = 300;
  const QR_CANDIDATE_STALE_MS_V200A7 = 220;
  const QR_CONFIRM_SPAN_MS_V200A7 = 240;

  // Alpha8: one stronger haptic pulse for EVERY new valid patrol-QR

    }

    if (!navigator.onLine) {
      showError(
        'No internet connection. Reconnect before scanning the next checkpoint.'
      );
      return;
    }

    if (typeof Html5Qrcode === 'undefined') {
      showError(
        'QR scanner library could not load. Refresh the page and try again.'
      );
      return;
    }

    document.getElementById('retryButton').classList.add('hidden');
    setMessage('Opening camera...', '');

    try {
      // Html5-qrcode supports facingMode directly. Let Chrome/Android choose
      // its normal rear camera instead of guessing a physical lens by label.
      await startScannerWithCamera_({
        facingMode: 'environment'
      });

    } catch (error) {
      scannerRunning = false;
      scanner = null;

      showError(
        'Camera access was not granted or the camera could not start. Allow camera permission in the browser and try again.'
      );
    }
  }


  function getScanFrameV200a7_() {
    return document.querySelector('.scan-corners');
  }


  function setScanFrameStateV200a7_(state) {
    const frame = getScanFrameV200a7_();
    if (!frame) return;

    frame.classList.toggle(
      'is-detected',
      state === 'detected' || state === 'confirmed'
    );

    frame.classList.toggle(
      'is-confirmed',
      state === 'confirmed'
    );
  }


  function vibrateQrDetectedV200a8_() {
    try {
      if (typeof navigator.vibrate === 'function') {
        // Cancel any stale vibration request first, then issue one clean pulse.
        // This runs once when a NEW valid patrol-QR candidate is detected.
        navigator.vibrate(0);
        navigator.vibrate(QR_HAPTIC_MS_V200A8);
      }
    } catch (ignored) {}
  }


  function announceInvalidQrV200a9_(decodedText) {
    const now = Date.now();
    const qrText = String(decodedText || '');

    const sameQrStillInView =
      qrText === lastInvalidQrTextV200a9 &&
      now - lastInvalidQrSeenAtV200a9 <=
        INVALID_QR_REARM_GAP_MS_V200A9;

    lastInvalidQrTextV200a9 = qrText;
    lastInvalidQrSeenAtV200a9 = now;

    if (sameQrStillInView) {
      return;
    }

    speakScanner(
      Number.isInteger(expected)
        ? 'Invalid QR. Scan checkpoint ' + expected + '.'
        : 'Invalid QR.'
    );
  }


  function clearQrCandidateTimerV200a7_() {
    if (qrCandidateTimerV200a7 !== null) {
      clearTimeout(qrCandidateTimerV200a7);
      qrCandidateTimerV200a7 = null;
    }
  }


  function resetQrCandidateV200a7_(restoreMessage) {
    clearQrCandidateTimerV200a7_();
    qrCandidatePointV200a7 = null;
    qrCandidateFirstSeenAtV200a7 = 0;
    qrCandidateLastSeenAtV200a7 = 0;

    if (!detectionLocked) {
      setScanFrameStateV200a7_('idle');

      if (restoreMessage) {
        setMessage('Align QR code within the frame.', '');
      }
    }
  }


  function scheduleQrCandidateCheckV200a7_() {
    clearQrCandidateTimerV200a7_();

    qrCandidateTimerV200a7 =
      setTimeout(function() {
        qrCandidateTimerV200a7 = null;

        if (
          detectionLocked ||
          qrCandidateFinalizingV200a7 ||
          !Number.isInteger(qrCandidatePointV200a7)
        ) {
          return;
        }

        const now = Date.now();
        const elapsed = now - qrCandidateFirstSeenAtV200a7;
        const freshness = now - qrCandidateLastSeenAtV200a7;

        const observedSpan =
          qrCandidateLastSeenAtV200a7 -
          qrCandidateFirstSeenAtV200a7;

        if (
          elapsed >= QR_CONFIRM_MS_V200A7 &&
          observedSpan >= QR_CONFIRM_SPAN_MS_V200A7 &&
          freshness <= QR_CANDIDATE_STALE_MS_V200A7
        ) {
          finalizeQrCandidateV200a7_(qrCandidatePointV200a7);
          return;
        }

        if (freshness > QR_CANDIDATE_STALE_MS_V200A7) {
          resetQrCandidateV200a7_(true);
          return;
        }

        scheduleQrCandidateCheckV200a7_();
      }, 60);
  }


  function onQrDecodeErrorV200a7_() {
    if (
      detectionLocked ||
      qrCandidateFinalizingV200a7 ||
      !Number.isInteger(qrCandidatePointV200a7)
    ) {
      return;
    }

    if (
      Date.now() - qrCandidateLastSeenAtV200a7 >
      QR_CANDIDATE_STALE_MS_V200A7
    ) {
      resetQrCandidateV200a7_(true);
    }
  }


  async function finalizeQrCandidateV200a7_(scannedPoint) {
    if (
      detectionLocked ||
      qrCandidateFinalizingV200a7 ||
      !Number.isInteger(scannedPoint)
    ) {
      return;
    }

    qrCandidateFinalizingV200a7 = true;
    detectionLocked = true;
    clearQrCandidateTimerV200a7_();
    releaseScannerBackProtectionV1113_();
    setScanFrameStateV200a7_('confirmed');

    setMessage('Checkpoint captured. Returning...', 'ok');

    await speakScannerAndWaitV1107_(
      'Checkpoint captured.',
      1200
    );

    await stopScanner();

    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage(
          {
            type: 'PATROL_QR_SCANNED',
            point: scannedPoint
          },
          '*'
        );

        try {
          window.opener.focus();
        } catch (ignored) {}

        setTimeout(function() {
          try {
            window.close();
          } catch (ignored) {}
        }, 150);

        return;

      } catch (ignored) {}
    }

    // Fallback if opener communication is unavailable.
    // replace() avoids adding another stale Guard page to browser history.
    window.location.replace(
      returnUrl +
      '?point=' +
      encodeURIComponent(scannedPoint) +
      '&scannerReturn=1'
    );
  }


  async function onQrDetected(decodedText) {
    if (detectionLocked || qrCandidateFinalizingV200a7) return;

    const scannedPoint = extractPoint(decodedText);

    if (!Number.isInteger(scannedPoint)) {
      setMessage(
        'Invalid patrol QR. Scan the checkpoint QR.',
        'warn'
      );
      announceInvalidQrV200a9_(decodedText);
      return;
    }

    if (!returnUrl) {
      showError('Patrol return address is missing.');
      return;
    }

    const now = Date.now();
    const candidateIsSame =
      scannedPoint === qrCandidatePointV200a7 &&
      now - qrCandidateLastSeenAtV200a7 <=
        QR_CANDIDATE_STALE_MS_V200A7;

    if (!candidateIsSame) {
      resetQrCandidateV200a7_(false);
      qrCandidatePointV200a7 = scannedPoint;
      qrCandidateFirstSeenAtV200a7 = now;
      qrCandidateLastSeenAtV200a7 = now;

      // Haptic means CAMERA DETECTED A VALID PATROL QR. Every new valid
      // scan candidate gets one pulse, before final capture/return confirmation.
      vibrateQrDetectedV200a8_();
      setScanFrameStateV200a7_('detected');
      setMessage('QR detected. Hold steady...', 'ok');
      scheduleQrCandidateCheckV200a7_();
      return;
    }

    qrCandidateLastSeenAtV200a7 = now;

    if (
      now - qrCandidateFirstSeenAtV200a7 >=
        QR_CONFIRM_MS_V200A7 &&
      qrCandidateLastSeenAtV200a7 -
        qrCandidateFirstSeenAtV200a7 >=
        QR_CONFIRM_SPAN_MS_V200A7
    ) {
      await finalizeQrCandidateV200a7_(scannedPoint);
    }
  }

  function extractPoint(text) {
    try {
      const parsed = new URL(text);
      const point = Number(parsed.searchParams.get('point'));

      if (Number.isInteger(point) && point >= 1 && point <= 999) {
        return point;
      }
    } catch (ignored) {}

    const plain = String(text || '').trim();

    if (/^\d{1,3}$/.test(plain)) {
      return Number(plain);
    }

    const match = plain.match(/(?:point|cp)\s*[-:#]?\s*(\d{1,3})/i);

    if (match) {
      return Number(match[1]);
    }

    return null;
  }


  async function stopScanner() {
    if (scanner && scannerRunning) {
      try {
        await scanner.stop();
      } catch (ignored) {}
    }

    if (scanner) {
      try {
        scanner.clear();
      } catch (ignored) {}
    }

    scannerRunning = false;
    scanner = null;
    zoomCapability = null;
    torchFeatureV200a7 = null;
    torchSupported = false;
    torchEnabled = false;
    resetQrCandidateV200a7_(false);
    await releaseScannerWakeLockV200a1_();
    updateCameraControls_();
  }


  function setMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text || '';
    el.className = 'message' + (type ? ' ' + type : '');
  }


  function showError(text) {
    setMessage(text, 'error');
    document.getElementById('retryButton').classList.remove('hidden');
  }
</script>
</body>
</html>
