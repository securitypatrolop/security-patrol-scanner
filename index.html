<!DOCTYPE html>
<!-- v2.0.0-alpha1 - Immersive Scanner -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Security Patrol Scanner</title>
  <!-- v1.9.9.0 - Navigation-Safe Scanner -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    /* =========================================================
       SECURITY PATROL 2.0.0-alpha1
       Immersive Scanner
       ========================================================= */

    * { box-sizing: border-box; }

    :root {
      --navy:#08233b;
      --navy-2:#0a2b49;
      --blue:#0b84e5;
      --green:#16834d;
      --red:#cc2d38;
      --amber:#b86b06;
      --text:#102038;
      --muted:#6b8297;
      --line:#d6e4ee;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
    }

    html,
    body {
      width:100%;
      height:100%;
      min-height:0;
      margin:0;
      overflow:hidden;
      overscroll-behavior:none;
      background:#061522;
    }

    body {
      color:#fff;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      touch-action:manipulation;
    }

    button { font:inherit; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    button:disabled { opacity:.5; cursor:default; }
    .hidden { display:none !important; }

    .page {
      width:100%;
      height:100vh;
      height:100dvh;
      min-height:0;
      padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      overflow:hidden;
      background:#061522;
    }

    .card {
      position:relative;
      width:100%;
      height:100%;
      min-height:0;
      max-width:620px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:#061522;
    }

    .scanner-brandbar {
      position:relative;
      z-index:20;
      flex:0 0 auto;
      min-height:60px;
      padding:0 14px;
      display:flex;
      align-items:center;
      background:linear-gradient(90deg,var(--navy),var(--navy-2));
      border-bottom:1px solid rgba(190,220,240,.12);
    }

    .scanner-brand { display:flex; align-items:center; gap:9px; }
    .scanner-brand-shield {
      width:29px;
      height:35px;
      display:grid;
      place-items:center;
      clip-path:polygon(50% 0,91% 16%,91% 54%,74% 79%,50% 100%,26% 79%,9% 54%,9% 16%);
      background:linear-gradient(180deg,#56c5ff,#1287d2);
      color:#fff;
      font-size:16px;
      font-weight:950;
    }
    .scanner-brand-name { color:#fff; font-size:15px; font-weight:900; }

    .scanner-context {
      position:relative;
      z-index:20;
      flex:0 0 auto;
      padding:10px 12px 9px;
      text-align:center;
      background:rgba(8,35,59,.98);
      border-bottom:1px solid rgba(183,215,237,.12);
    }

    .scanner-context-label {
      color:#9bc2db;
      font-size:9px;
      line-height:1;
      font-weight:900;
      letter-spacing:1px;
    }

    .expected { margin:0; padding:0; background:transparent; border:0; text-align:center; }
    .expected .point {
      margin-top:3px;
      color:#fff;
      font-size:clamp(35px,9.5vw,46px);
      line-height:.98;
      font-weight:950;
      letter-spacing:-1.5px;
    }
    .expected .name {
      margin-top:4px;
      color:#eaf5fc;
      font-size:clamp(13px,3.6vw,16px);
      line-height:1.15;
      font-weight:850;
    }

    .camera-stage {
      position:relative;
      flex:1 1 0;
      min-height:0;
      margin:0;
      overflow:hidden;
      border:0;
      border-radius:0;
      background:#000;
      box-shadow:none;
    }

    #reader {
      position:absolute !important;
      inset:0 !important;
      width:100% !important;
      height:100% !important;
      min-height:100% !important;
      display:flex !important;
      align-items:center;
      justify-content:center;
      overflow:hidden !important;
      background:#000;
    }

    #reader > div { width:100% !important; height:100% !important; margin:0 !important; }
    #reader video {
      width:100% !important;
      height:100% !important;
      max-width:none !important;
      object-fit:cover !important;
      object-position:50% 50% !important;
    }

    #reader img,
    #reader button,
    #reader select { max-width:100%; }

    .scan-corners {
      position:absolute;
      z-index:8;
      left:50%;
      top:48%;
      width:min(64vw,260px);
      aspect-ratio:1/1;
      transform:translate(-50%,-50%);
      pointer-events:none;
    }

    .scan-corners::before,
    .scan-corners::after { content:""; position:absolute; inset:0; }

    .scan-corners::before {
      border:0;
      background:
        linear-gradient(var(--blue),var(--blue)) left top/46px 4px no-repeat,
        linear-gradient(var(--blue),var(--blue)) left top/4px 46px no-repeat,
        linear-gradient(var(--blue),var(--blue)) right top/46px 4px no-repeat,
        linear-gradient(var(--blue),var(--blue)) right top/4px 46px no-repeat,
        linear-gradient(var(--blue),var(--blue)) left bottom/46px 4px no-repeat,
        linear-gradient(var(--blue),var(--blue)) left bottom/4px 46px no-repeat,
        linear-gradient(var(--blue),var(--blue)) right bottom/46px 4px no-repeat,
        linear-gradient(var(--blue),var(--blue)) right bottom/4px 46px no-repeat;
      filter:drop-shadow(0 0 4px rgba(11,132,229,.3));
    }

    .scan-corners::after { display:none !important; }

    .scanner-footer {
      position:absolute;
      z-index:18;
      left:0;
      right:0;
      bottom:0;
      min-height:116px;
      padding:34px 12px calc(10px + var(--safe-bottom));
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      gap:7px;
      background:linear-gradient(180deg,rgba(2,13,22,0),rgba(2,13,22,.76) 30%,rgba(2,13,22,.95));
      pointer-events:none;
    }

    .message {
      min-height:17px;
      max-width:92%;
      color:#eef8ff;
      font-size:clamp(10px,2.8vw,12px);
      line-height:1.2;
      font-weight:800;
      text-align:center;
      text-shadow:0 1px 3px rgba(0,0,0,.5);
      pointer-events:auto;
    }
    .message.ok { color:#b9f4d4; }
    .message.warn { color:#ffe0a9; }
    .message.error { color:#ffc3c7; }

    .controls-row { width:100%; display:flex; justify-content:center; align-items:center; pointer-events:auto; }
    .camera-controls { display:flex; align-items:center; justify-content:center; gap:10px; }

    .camera-control {
      min-width:58px;
      min-height:50px;
      padding:7px 10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(205,229,244,.26);
      border-radius:15px;
      background:rgba(5,31,50,.76);
      backdrop-filter:blur(8px);
      color:#fff;
      font-size:15px;
      font-weight:900;
      box-shadow:0 5px 18px rgba(0,0,0,.18);
      transition:transform .10s ease, background .12s ease, border-color .12s ease;
    }
    .camera-control:active { transform:translateY(1px) scale(.97); }
    #torchButton.is-on { background:rgba(11,132,229,.92); border-color:#5bb6f4; }

    #retryButton {
      min-height:48px;
      padding:10px 18px;
      border-radius:13px;
      background:linear-gradient(180deg,#1498ef,#0878ce);
      color:#fff;
      font-size:13px;
      font-weight:950;
      box-shadow:0 7px 18px rgba(8,120,206,.28);
    }

    .small {
      color:#c2d7e5;
      font-size:9px;
      line-height:1.15;
      text-align:center;
      opacity:.9;
      pointer-events:none;
    }

    .scanner-back-toast-v1113 {
      position:fixed;
      z-index:9999;
      left:50%;
      bottom:max(18px,var(--safe-bottom));
      width:min(calc(100% - 28px),420px);
      transform:translate(-50%,16px);
      padding:12px 14px;
      border-radius:13px;
      background:var(--navy);
      color:#fff;
      box-shadow:0 12px 30px rgba(0,0,0,.26);
      opacity:0;
      visibility:hidden;
      transition:opacity .18s ease,transform .18s ease,visibility .18s ease;
      pointer-events:none;
      text-align:center;
      font-size:12px;
      font-weight:850;
    }
    .scanner-back-toast-v1113.show { opacity:1; visibility:visible; transform:translate(-50%,0); }

    @media (max-height:700px) {
      .scanner-brandbar { min-height:50px; padding:0 10px; }
      .scanner-brand-shield { width:25px; height:30px; font-size:14px; }
      .scanner-brand-name { font-size:13px; }
      .scanner-context { padding:6px 9px 5px; }
      .scanner-context-label { font-size:7.5px; }
      .expected .point { font-size:clamp(29px,7.8vw,36px); }
      .expected .name { margin-top:2px; font-size:clamp(11px,3vw,13px); }
      .scan-corners { width:min(56vw,215px); }
      .scanner-footer { min-height:96px; padding-top:26px; gap:4px; }
      .camera-control { min-width:52px; min-height:44px; border-radius:12px; font-size:13px; }
      .small { font-size:7.5px; }
    }

    @media (max-height:600px) {
      .small { display:none; }
      .scanner-brandbar { min-height:44px; }
      .scanner-context { padding:4px 7px; }
      .expected .point { font-size:27px; }
      .scan-corners { width:min(49vw,190px); }
      .scanner-footer { min-height:78px; padding-top:18px; }
      .camera-control { min-width:48px; min-height:40px; }
    }

  </style>
</head>

<body>
<div class="page">
  <div class="card">
    <div class="scanner-brandbar">
      <div class="scanner-brand">
        <div class="scanner-brand-shield" aria-hidden="true"><span>✓</span></div>
        <div class="scanner-brand-name">SECURITY PATROL</div>
      </div>
    </div>

    <div class="scanner-context">
      <div class="scanner-context-label">SCAN CHECKPOINT</div>
      <div class="expected">
        <div id="expectedPoint" class="point">CHECKPOINT</div>
        <div id="expectedName" class="name"></div>
      </div>
    </div>

    <div class="camera-stage">
      <div id="reader"></div>
      <div class="scan-corners" aria-hidden="true"></div>
    </div>

    <div class="scanner-footer">
      <div id="message" class="message">Starting camera...</div>

      <div class="controls-row">
        <div id="cameraControls" class="camera-controls hidden">
          <button id="switchCameraButton"
                  class="camera-control"
                  type="button"
                  title="Switch rear camera"
                  aria-label="Switch rear camera"
                  onclick="switchRearCamera_()">
            📷
          </button>

          <button id="torchButton"
                  class="camera-control hidden"
                  type="button"
                  title="Turn flashlight on"
                  aria-label="Turn flashlight on"
                  onclick="toggleTorch_()">
            🔦
          </button>

          <button id="zoomButton"
                  class="camera-control"
                  type="button"
                  title="Change camera zoom"
                  aria-label="Change camera zoom"
                  onclick="toggleZoom_()">
            1×
          </button>
        </div>

        <button id="retryButton"
                class="hidden"
                onclick="startScanner()">
          TRY AGAIN
        </button>

      </div>

      <div class="small">
        Align QR code within the frame.
      </div>
    </div>
  </div>
</div>

<div
  id="scannerBackToastV1113"
  class="scanner-back-toast-v1113"
  role="status"
  aria-live="polite"
>
  Back is disabled while the checkpoint scanner is active.
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  const expected = Number(params.get('expected'));
  const totalCheckpoints = Number(params.get('total')) || 22;
  const expectedName = params.get('name') || '';
  const returnUrl = params.get('return') || '';
  const voiceEnabled = params.get('voice') !== '0';

  let scanner = null;
  let scannerRunning = false;
  let detectionLocked = false;

  let scannerVoiceUnlockedV1107 =
    false;

  const CAMERA_STORAGE_KEY = 'securityPatrolPreferredCameraId';
  const ZOOM_STORAGE_KEY = 'securityPatrolPreferredZoom';

  let availableRearCameras = [];
  let activeRearCameraIndex = -1;
  let activeCameraId = '';
  let currentZoom = 1;
  let zoomCapability = null;
  let torchSupported = false;
  let torchEnabled = false;
  let scannerWakeLockV200a1 = null;

  const SCANNER_BACK_STATE_KEY_V1113 =
    'scannerBackGuardV1113';

  let scannerBackProtectionInstalledV1113 = false;
  let scannerBackProtectionEnabledV1113 = true;
  let scannerBackToastTimerV1113 = null;

  document.getElementById('expectedPoint').textContent =
    Number.isInteger(expected)
      ? (String(expected).padStart(2, '0') + ' / ' + String(totalCheckpoints).padStart(2, '0'))
      : 'CHECKPOINT';

  document.getElementById('expectedName').textContent = expectedName || '';

  window.addEventListener(
    'load',
    handleScannerLoadV1107_
  );

  document.addEventListener(
    'pointerdown',
    unlockScannerVoiceV1107_,
    true
  );

  document.addEventListener(
    'keydown',
    unlockScannerVoiceV1107_,
    true
  );

  window.addEventListener('pagehide', function() {
    stopScanner();
  });

  document.addEventListener('visibilitychange', function() {
    if (
      document.visibilityState === 'visible' &&
      scannerRunning
    ) {
      requestScannerWakeLockV200a1_();
    }
  });


  function installScannerBackProtectionV1113_() {
    if (scannerBackProtectionInstalledV1113) {
      return;
    }

    scannerBackProtectionInstalledV1113 = true;
    scannerBackProtectionEnabledV1113 = true;

    window.addEventListener(
      'popstate',
      handleScannerBackAttemptV1113_,
      false
    );

    armScannerBackProtectionV1113_();
  }


  function armScannerBackProtectionV1113_() {
    if (!scannerBackProtectionEnabledV1113) {
      return;
    }

    try {
      if (
        history.state &&
        history.state[SCANNER_BACK_STATE_KEY_V1113]
      ) {
        return;
      }

      const state = {};
      state[SCANNER_BACK_STATE_KEY_V1113] = true;

      history.pushState(
        state,
        document.title,
        window.location.href
      );
    } catch (ignored) {}
  }


  function handleScannerBackAttemptV1113_() {
    if (!scannerBackProtectionEnabledV1113) {
      return;
    }

    setTimeout(function() {
      armScannerBackProtectionV1113_();
      showScannerBackToastV1113_();
    }, 0);
  }


  function showScannerBackToastV1113_() {
    const toast =
      document.getElementById(
        'scannerBackToastV1113'
      );

    if (!toast) {
      return;
    }

    if (scannerBackToastTimerV1113) {
      clearTimeout(scannerBackToastTimerV1113);
    }

    toast.classList.add('show');

    scannerBackToastTimerV1113 =
      setTimeout(function() {
        toast.classList.remove('show');
        scannerBackToastTimerV1113 = null;
      }, 2000);
  }


  function releaseScannerBackProtectionV1113_() {
    scannerBackProtectionEnabledV1113 = false;

    if (scannerBackToastTimerV1113) {
      clearTimeout(scannerBackToastTimerV1113);
      scannerBackToastTimerV1113 = null;
    }
  }


  function handleScannerLoadV1107_() {
    installScannerBackProtectionV1113_();

    try {
      if (
        navigator.userActivation &&
        navigator.userActivation.hasBeenActive
      ) {
        scannerVoiceUnlockedV1107 =
          true;
      }
    } catch (ignored) {}

    speakScanner(
      Number.isInteger(expected)
        ? (
            'Scanner opened. Scan checkpoint ' +
            expected +
            '.'
          )
        : 'Scanner opened.'
    );

    startScanner();
  }


  function unlockScannerVoiceV1107_() {
    if (
      scannerVoiceUnlockedV1107 ||
      !scannerVoiceSupported()
    ) {
      return;
    }

    scannerVoiceUnlockedV1107 =
      true;

    speakScanner(
      Number.isInteger(expected)
        ? (
            'Ready to scan checkpoint ' +
            expected +
            '.'
          )
        : 'Ready to scan.'
    );
  }


  function speakScannerAndWaitV1107_(
    text,
    maximumWaitMs
  ) {
    return new Promise(
      function(resolve) {
        if (
          !scannerVoiceSupported() ||
          !text
        ) {
          resolve();
          return;
        }

        let finished = false;

        function done() {
          if (finished) return;
          finished = true;
          resolve();
        }

        try {
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();

          const utterance =
            new SpeechSynthesisUtterance(
              String(text)
            );

          utterance.lang = 'en-MY';
          utterance.rate = 0.75;
          utterance.pitch = 1;
          utterance.volume = 1;

          utterance.onstart =
            function() {
              scannerVoiceUnlockedV1107 =
                true;
            };

          utterance.onend = done;
          utterance.onerror = done;

          window.speechSynthesis.speak(
            utterance
          );

          setTimeout(
            done,
            Number(
              maximumWaitMs || 1200
            )
          );

        } catch (ignored) {
          done();
        }
      }
    );
  }


  function scannerVoiceSupported() {
    return (
      voiceEnabled &&
      'speechSynthesis' in window &&
      'SpeechSynthesisUtterance' in window
    );
  }


  function speakScanner(text) {
    if (!scannerVoiceSupported() || !text) {
      return;
    }

    try {
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();

      const utterance =
        new SpeechSynthesisUtterance(String(text));

      utterance.lang = 'en-MY';
      utterance.rate = 0.75;
      utterance.pitch = 1;
      utterance.volume = 1;

      const voices =
        window.speechSynthesis.getVoices();

      const preferredVoice =
        voices.find(function(voice) {
          return String(voice.lang || '').toLowerCase() === 'en-my';
        }) ||
        voices.find(function(voice) {
          return String(voice.lang || '').toLowerCase().indexOf('en-gb') === 0;
        }) ||
        voices.find(function(voice) {
          return String(voice.lang || '').toLowerCase().indexOf('en') === 0;
        });

      if (preferredVoice) {
        utterance.voice = preferredVoice;
      }

      window.speechSynthesis.speak(utterance);

    } catch (ignored) {
      // Scanner voice must never interfere with QR scanning.
    }
  }


  async function loadRearCameras_() {
    let cameras = [];

    try {
      cameras = await Html5Qrcode.getCameras();
    } catch (ignored) {
      cameras = [];
    }

    const ranked = cameras
      .map(function(camera, index) {
        const label = String(camera.label || '').toLowerCase();
        let score = 0;

        if (/back|rear|environment/.test(label)) score += 100;
        if (/main|primary|standard/.test(label)) score += 60;
        if (/\bwide\b/.test(label) && !/ultra/.test(label)) score += 15;

        if (/ultra[\s-]?wide|ultrawide|0[\.,]5x?|macro|telephoto|depth/.test(label)) {
          score -= 180;
        }

        if (/front|selfie|user/.test(label)) {
          score -= 250;
        }

        score -= index;

        return {
          camera: camera,
          label: label,
          score: score,
          originalIndex: index
        };
      });

    const rearCandidates = ranked.filter(function(item) {
      return !/front|selfie|user/.test(item.label);
    });

    rearCandidates.sort(function(a, b) {
      return b.score - a.score;
    });

    availableRearCameras = rearCandidates.map(function(item) {
      return item.camera;
    });

    if (!availableRearCameras.length) {
      availableRearCameras = cameras.slice();
    }

    return availableRearCameras;
  }


  function loadRememberedCameraId_() {
    try {
      return String(localStorage.getItem(CAMERA_STORAGE_KEY) || '');
    } catch (ignored) {
      return '';
    }
  }


  function rememberCameraId_(cameraId) {
    try {
      if (cameraId) {
        localStorage.setItem(CAMERA_STORAGE_KEY, cameraId);
      }
    } catch (ignored) {}
  }


  function loadRememberedZoom_() {
    try {
      const saved = Number(localStorage.getItem(ZOOM_STORAGE_KEY));
      return Number.isFinite(saved) && saved > 0 ? saved : 1;
    } catch (ignored) {
      return 1;
    }
  }


  function rememberZoom_(zoom) {
    try {
      localStorage.setItem(ZOOM_STORAGE_KEY, String(zoom));
    } catch (ignored) {}
  }


  async function getPreferredRearCamera_() {
    await loadRearCameras_();

    if (!availableRearCameras.length) {
      activeRearCameraIndex = -1;
      activeCameraId = '';
      return { facingMode: { exact: 'environment' } };
    }

    const rememberedId = loadRememberedCameraId_();
    let selectedIndex = -1;

    if (rememberedId) {
      selectedIndex = availableRearCameras.findIndex(function(camera) {
        return String(camera.id) === rememberedId;
      });
    }

    if (selectedIndex < 0) {
      selectedIndex = 0;
    }

    activeRearCameraIndex = selectedIndex;
    activeCameraId = String(availableRearCameras[selectedIndex].id || '');

    if (activeCameraId) {
      return { deviceId: { exact: activeCameraId } };
    }

    return { facingMode: { exact: 'environment' } };
  }


  async function readCameraZoomCapability_() {
    zoomCapability = null;
    torchSupported = false;
    torchEnabled = false;

    if (!scanner || !scannerRunning) {
      return;
    }

    try {
      const capabilities = scanner.getRunningTrackCapabilities();
      if (
        capabilities &&
        capabilities.zoom &&
        typeof capabilities.zoom.min === 'number' &&
        typeof capabilities.zoom.max === 'number'
      ) {
        zoomCapability = capabilities.zoom;
      }

      if (
        capabilities &&
        (
          capabilities.torch === true ||
          (Array.isArray(capabilities.fillLightMode) && capabilities.fillLightMode.length > 0)
        )
      ) {
        torchSupported = true;
      }
    } catch (ignored) {}

    try {
      const settings = scanner.getRunningTrackSettings();
      if (settings && typeof settings.torch === 'boolean') {
        torchEnabled = settings.torch;
      }
    } catch (ignored) {}
  }


  async function applyPreferredZoom_() {
    await readCameraZoomCapability_();

    if (!zoomCapability) {
      currentZoom = 1;
      updateCameraControls_();
      return;
    }

    let desired = loadRememberedZoom_();

    desired = Math.min(
      zoomCapability.max,
      Math.max(zoomCapability.min, desired)
    );

    currentZoom = desired;

    try {
      await scanner.applyVideoConstraints({
        advanced: [{ zoom: desired }]
      });
    } catch (ignored) {}

    updateCameraControls_();
  }


  async function toggleZoom_() {
    if (!zoomCapability || !scannerRunning) {
      return;
    }

    const canUseTwo =
      zoomCapability.max >= 2 &&
      zoomCapability.min <= 2;

    let nextZoom;

    if (canUseTwo) {
      nextZoom = currentZoom >= 1.75 ? 1 : 2;
    } else {
      const midpoint =
        Math.max(
          zoomCapability.min,
          Math.min(
            zoomCapability.max,
            (zoomCapability.min + zoomCapability.max) / 2
          )
        );

      nextZoom =
        Math.abs(currentZoom - zoomCapability.min) < 0.05
          ? midpoint
          : zoomCapability.min;
    }

    nextZoom = Math.min(
      zoomCapability.max,
      Math.max(zoomCapability.min, nextZoom)
    );

    try {
      await scanner.applyVideoConstraints({
        advanced: [{ zoom: nextZoom }]
      });

      currentZoom = nextZoom;
      rememberZoom_(nextZoom);
      updateCameraControls_();

    } catch (ignored) {}
  }


  async function toggleTorch_() {
    if (!torchSupported || !scannerRunning) {
      return;
    }

    const nextState = !torchEnabled;

    try {
      await scanner.applyVideoConstraints({
        advanced: [{ torch: nextState }]
      });

      torchEnabled = nextState;
      updateCameraControls_();
      setMessage(
        nextState ? 'Flashlight enabled.' : 'Flashlight disabled.',
        nextState ? 'ok' : ''
      );
      return;
    } catch (ignored) {}

    try {
      await scanner.applyVideoConstraints({
        advanced: [{ fillLightMode: nextState ? 'flash' : 'off' }]
      });

      torchEnabled = nextState;
      updateCameraControls_();
      setMessage(
        nextState ? 'Flashlight enabled.' : 'Flashlight disabled.',
        nextState ? 'ok' : ''
      );
    } catch (ignored) {
      setMessage(
        'Flashlight is not available on this phone or camera.',
        'warn'
      );
    }
  }


  async function switchRearCamera_() {
    if (availableRearCameras.length <= 1) {
      return;
    }

    const nextIndex =
      activeRearCameraIndex < 0
        ? 0
        : (activeRearCameraIndex + 1) % availableRearCameras.length;

    const nextCamera =
      availableRearCameras[nextIndex];

    const nextCameraId =
      String(nextCamera && nextCamera.id || '');

    if (!nextCameraId) {
      return;
    }

    setMessage('Switching rear camera...', '');

    await stopScanner();

    activeRearCameraIndex = nextIndex;
    activeCameraId = nextCameraId;
    rememberCameraId_(nextCameraId);

    await startScannerWithCamera_({
      deviceId: { exact: nextCameraId }
    });
  }


  function updateCameraControls_() {
    const controls =
      document.getElementById('cameraControls');

    const switchButton =
      document.getElementById('switchCameraButton');

    const torchButton =
      document.getElementById('torchButton');

    const zoomButton =
      document.getElementById('zoomButton');

    if (!controls || !switchButton || !torchButton || !zoomButton) {
      return;
    }

    const multipleRearCameras =
      availableRearCameras.length > 1;

    const zoomAvailable =
      !!zoomCapability &&
      zoomCapability.max > zoomCapability.min;

    const anyControlAvailable =
      multipleRearCameras ||
      zoomAvailable ||
      torchSupported;

    if (!anyControlAvailable) {
      controls.classList.add('hidden');
      return;
    }

    controls.classList.remove('hidden');

    switchButton.disabled = !multipleRearCameras;
    switchButton.classList.toggle('hidden', !multipleRearCameras);

    torchButton.disabled = !torchSupported;
    torchButton.classList.toggle('hidden', !torchSupported);
    torchButton.classList.toggle('is-on', !!torchEnabled);
    torchButton.textContent = torchEnabled ? '💡' : '🔦';
    torchButton.title = torchEnabled ? 'Turn flashlight off' : 'Turn flashlight on';
    torchButton.setAttribute('aria-label', torchButton.title);

    zoomButton.disabled = !zoomAvailable;
    zoomButton.classList.toggle('hidden', !zoomAvailable);

    if (zoomAvailable) {
      const rounded =
        Math.round(currentZoom * 10) / 10;

      zoomButton.textContent =
        String(rounded).replace(/\.0$/, '') + '×';

      zoomButton.title =
        'Camera zoom ' + zoomButton.textContent;
      zoomButton.setAttribute('aria-label', zoomButton.title);
    }
  }


  function getAdaptiveQrBox_() {
    const reader = document.getElementById('reader');

    if (!reader) {
      return { width: 220, height: 220 };
    }

    const rect = reader.getBoundingClientRect();
    const available =
      Math.max(
        120,
        Math.min(
          Number(rect.width) || 320,
          Number(rect.height) || 320
        )
      );

    const side =
      Math.floor(
        Math.max(
          120,
          Math.min(260, available * 0.68)
        )
      );

    return {
      width: side,
      height: side
    };
  }


  async function requestScannerWakeLockV200a1_() {
    if (
      !('wakeLock' in navigator) ||
      document.visibilityState !== 'visible'
    ) {
      return;
    }

    try {
      if (scannerWakeLockV200a1) {
        return;
      }

      scannerWakeLockV200a1 =
        await navigator.wakeLock.request('screen');

      scannerWakeLockV200a1.addEventListener(
        'release',
        function() {
          scannerWakeLockV200a1 = null;
        }
      );
    } catch (ignored) {
      scannerWakeLockV200a1 = null;
    }
  }


  async function releaseScannerWakeLockV200a1_() {
    const lock = scannerWakeLockV200a1;
    scannerWakeLockV200a1 = null;

    if (!lock) {
      return;
    }

    try {
      await lock.release();
    } catch (ignored) {}
  }


  async function startScannerWithCamera_(cameraConfig) {
    scanner = new Html5Qrcode('reader');
    scannerRunning = true;

    await scanner.start(
      cameraConfig,
      {
        fps: 10,
        qrbox: getAdaptiveQrBox_()
      },
      onQrDetected,
      function() {}
    );

    try {
      const settings = scanner.getRunningTrackSettings();
      if (settings && settings.deviceId) {
        activeCameraId = String(settings.deviceId);

        const matchedIndex =
          availableRearCameras.findIndex(function(camera) {
            return String(camera.id) === activeCameraId;
          });

        if (matchedIndex >= 0) {
          activeRearCameraIndex = matchedIndex;
        }

        rememberCameraId_(activeCameraId);
      }
    } catch (ignored) {}

    await applyPreferredZoom_();
    await requestScannerWakeLockV200a1_();

    setMessage(
      'Align QR code within the frame.',
      ''
    );

    // Voice is handled at scanner entry or natural scanner interaction.
  }




  async function startScanner() {
    detectionLocked = false;

    if (!window.isSecureContext) {
      showError(
        'Camera requires HTTPS. This scanner page must be hosted on a secure HTTPS address.'
      );
      return;
    }

    if (!navigator.onLine) {
      showError(
        'No internet connection. Reconnect before scanning the next checkpoint.'
      );
      return;
    }

    if (typeof Html5Qrcode === 'undefined') {
      showError(
        'QR scanner library could not load. Refresh the page and try again.'
      );
      return;
    }

    document.getElementById('retryButton').classList.add('hidden');
    setMessage('Opening camera...', '');

    try {
      const cameraConfig = await getPreferredRearCamera_();
      await startScannerWithCamera_(cameraConfig);

    } catch (error) {
      scannerRunning = false;
      scanner = null;

      showError(
        'Camera access was not granted or the camera could not start. Allow camera permission in the browser and try again.'
      );
    }
  }


  async function onQrDetected(decodedText) {
    if (detectionLocked) return;

    const scannedPoint = extractPoint(decodedText);

    if (!Number.isInteger(scannedPoint)) {
      setMessage(
        'Invalid patrol QR. Scan the checkpoint QR.',
        'warn'
      );
      return;
    }

    if (!returnUrl) {
      showError('Patrol return address is missing.');
      return;
    }

    detectionLocked = true;
    releaseScannerBackProtectionV1113_();

    setMessage('Checkpoint scanned. Returning...', 'ok');

    await speakScannerAndWaitV1107_(
      'Checkpoint scanned.',
      1200
    );

    await stopScanner();

    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage(
          {
            type: 'PATROL_QR_SCANNED',
            point: scannedPoint
          },
          '*'
        );

        try {
          window.opener.focus();
        } catch (ignored) {}

        setTimeout(function() {
          try {
            window.close();
          } catch (ignored) {}
        }, 150);

        return;

      } catch (ignored) {}
    }

    // Fallback if opener communication is unavailable.
    // replace() avoids adding another stale Guard page to browser history.
    window.location.replace(
      returnUrl +
      '?point=' +
      encodeURIComponent(scannedPoint) +
      '&scannerReturn=1'
    );
  }


  function extractPoint(text) {
    try {
      const parsed = new URL(text);
      const point = Number(parsed.searchParams.get('point'));

      if (Number.isInteger(point) && point >= 1 && point <= 999) {
        return point;
      }
    } catch (ignored) {}

    const plain = String(text || '').trim();

    if (/^\d{1,3}$/.test(plain)) {
      return Number(plain);
    }

    const match = plain.match(/(?:point|cp)\s*[-:#]?\s*(\d{1,3})/i);

    if (match) {
      return Number(match[1]);
    }

    return null;
  }


  async function stopScanner() {
    if (scanner && scannerRunning) {
      try {
        await scanner.stop();
      } catch (ignored) {}
    }

    if (scanner) {
      try {
        scanner.clear();
      } catch (ignored) {}
    }

    scannerRunning = false;
    scanner = null;
    zoomCapability = null;
    torchSupported = false;
    torchEnabled = false;
    await releaseScannerWakeLockV200a1_();
    updateCameraControls_();
  }


  function setMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text || '';
    el.className = 'message' + (type ? ' ' + type : '');
  }


  function showError(text) {
    setMessage(text, 'error');
    document.getElementById('retryButton').classList.remove('hidden');
  }
</script>
</body>
</html>
